<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mastermind</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mastermind</h1>
    <!-- <p class="subtitle">Super duper good mastermind game</p> -->
    <div class="top-actions">
      <button class="btn">PvP</button>
      <button class="btn">PvAI</button>
      <button class="btn">New game</button>
      <button class="btn">Submit guess</button>
      <button class="btn">Reveal code</button>
    </div>
  </header>

    <main class="wrap">
      <div id="main-game-board">
        <section class="board-area">
          <ol class="guesses">
            <li class="guess-row">
              <div class="peg-slots">
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
            </div>
              <div class="feedback">
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
              </div>
            </li>

            <li class="guess-row">
              <div class="peg-slots">
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
              </div>
              <div class="feedback">
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
              </div>
            </li>

            <li class="guess-row">
              <div class="peg-slots">
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
                <div class="peg-slot"></div>
              </div>
              <div class="feedback">
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
                <div class="feedback-slot"></div>
              </div>
            </li>


          </ol>

          <!-- Secret row for secret pass code -->
          <div class="secret-row">
            <div class="secret-pegs">
              <div class="code-slot covered"></div>
              <div class="code-slot covered"></div>
              <div class="code-slot covered"></div>
              <div class="code-slot covered"></div>
              <div class="code-slot covered"></div>
            </div>
          </div>
        </section>

        <!-- Colors -->
        <aside class="controls">
          <h3>Colors</h3>
          <div class="colors">
              <!-- röd, grön, blå, gul, vit, svart -->
            <button class="color-switch" data-color="red"></button>
            <button class="color-switch" data-color="green"></button>
            <button class="color-switch" data-color="blue"></button>
            <button class="color-switch" data-color="yellow"></button>
            <button class="color-switch" data-color="white"></button>
            <button class="color-switch" data-color="black"></button>
          </div>
        </aside>
      </div>
    </main>

    <footer class="footer">
        <script src="script.js"></script>
    </footer>

  
</body>
</html>
